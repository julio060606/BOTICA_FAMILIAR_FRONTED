<!--

Esta es la logica del sistema



1. Dashboard (El Resumen Ejecutivo)

Propósito: Que el administrador sepa cómo va el negocio en 5 segundos.



Acciones del usuario: Solo visualización y filtrado rápido (Ver "Hoy", "Ayer", "Esta semana").

Datos que extrae (Lectura):

Suma total de S/ vendidos en el día (filtrando ventas válidas, sin contar anuladas).

Cantidad de tickets emitidos.

Top 5 de productos más vendidos hoy.

Alertas automáticas (Visuales):

Rojas: Lista rápida de productos con "Stock Actual <= Stock Mínimo".

Amarillas: Lotes con fecha de caducidad en los próximos 90 días.

🛒 2. Ventas (La Operación Diaria)

El bloque donde el cajero pasa el 90% de su turno.



POS (Punto de Venta)

Acciones: Escanear SKU, modificar cantidad (+/-), aplicar descuentos manuales (si tiene permiso), seleccionar cliente, elegir medio de pago, cobrar e imprimir ticket.

Datos que ingresa: Código de producto, monto de dinero entregado por el cliente.

Datos que extrae/Maneja: Lee precios y stock en tiempo real del Catálogo.

Impacto en BD: Inserta un registro en la tabla ventas y varios en ventas_detalle. Reduce el stock_actual del inventario.

Historial de Tickets

Acciones: Buscar tickets pasados (por número o fecha), ver el detalle de qué se llevó el cliente, reimprimir voucher, y Anular Venta.

Datos que muestra: Tabla con: Nro. Ticket, Fecha/Hora, Cliente, Total S/, Medio de Pago, Cajero, Estado (Válido/Anulado).

Impacto en BD: Al anular, cambia el estado del ticket a "Anulado" y hace un UPDATE en el inventario para devolver el stock a las vitrinas.

Control de Caja (Arqueo)

Acciones: "Abrir Caja" al inicio del turno, registrar ingresos/egresos manuales (ej. Ingreso: "Sencillo adicional S/50" / Egreso: "Pasajes S/10"), y "Cerrar Caja".

Datos que ingresa: Montos de dinero físico contado por el cajero, conceptos de gastos.

Datos que extrae/Calcula: El sistema suma el (Saldo Inicial + Ventas en Efectivo - Egresos) e indica si al cajero le Falta o le Sobra dinero.

📦 3. Inventario (El Almacén y Catálogo)

Donde mantienes el negocio abastecido y ordenado.



Catálogo de Productos

Acciones: Crear, editar, inactivar medicamentos. Armar "Combos" virtuales.

Datos que ingresa: SKU (o autogenerado), Nombre completo, Categoría, Precio de Costo, Precio de Venta, Stock Mínimo.

Datos que muestra: Tabla gigante con buscador rápido para ver todo lo que existe en la botica, con un switch para ocultar lo que está inactivo.

Ingreso de Mercadería (Compras)

Acciones: Registrar la llegada de una nueva factura del laboratorio/droguería para aumentar el stock.

Datos que ingresa: Nro. Factura del proveedor, Selección del producto, Cantidad que llegó, Nuevo Lote, Fecha de Vencimiento, y si el precio de costo cambió.

Impacto en BD: Aumenta el stock_actual en el Catálogo y guarda el nuevo Lote.

Kardex (Auditoría Intocable)

Acciones: Buscar un producto específico (ej. Paracetamol) y ver todo su historial. Es solo lectura, nadie puede borrar nada de aquí.

Datos que muestra: Una tabla que lista: Fecha/Hora, Tipo de Movimiento (Entrada por Compra, Salida por Venta, Entrada por Anulación, Salida por Vencimiento), Cantidad movida, Saldo Final, y qué Usuario lo hizo.

📊 4. Reportes (Inteligencia del Negocio)

Herramientas para tomar decisiones de compra.



Ventas y Utilidades

Acciones: Filtrar por rango de fechas y exportar a Excel.

Datos que extrae/Calcula: Agrupa las ventas y resta (Total Ventas - Costo de Compra) para mostrar la Ganancia Neta (Utilidad) de la botica en ese mes.

Próximos a Vencer

Acciones: Filtrar lotes que vencen en 1, 3 o 6 meses.

Datos que muestra: SKU, Nombre, Lote exacto, Fecha de Caducidad y cuántas unidades físicas corren el riesgo de perderse para poder armar promociones urgentes.

⚙️ 5. Configuración (Las Reglas del Juego)

Acceso exclusivo para el dueño o administrador.



Usuarios y Permisos

Acciones: Crear cuentas para los empleados, cambiar contraseñas, inactivar extrabajadores.

Datos que ingresa: Nombres, Usuario, Contraseña (se guarda encriptada), Rol (Cajero o Administrador).

Empresa y SUNAT

Acciones: Configurar los datos de los tickets y la facturación.

Datos que ingresa: RUC de tu empresa, Razón Social, Dirección, Logo (imagen), Token de seguridad de la SUNAT, y los correlativos iniciales (ej. Boleta B001-0001, Factura F001-0001).
