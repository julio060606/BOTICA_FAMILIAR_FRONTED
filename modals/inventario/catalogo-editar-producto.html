<!-- ========================================== -->
<!-- MODAL: EDITAR PRODUCTO                     -->
<!-- ========================================== -->
<div class="modal fade" id="modalEditarProducto" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content modal-content-google">
      
      <div class="modal-header border-bottom-0 pt-4 px-4 pb-0">
        <h5 class="modal-title fw-medium text-google-title fs-5">Editar Producto</h5>
        <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      
      <div class="modal-body p-4">
        <form>
          <!-- ¡MUY IMPORTANTE! Este input oculto guarda el ID del producto que estamos editando -->
          <input type="hidden" id="edit-id">
          
          <!-- Control Crítico: Inactivar Medicamento -->
          <div class="mb-4 p-3 rounded-3 border-google d-flex justify-content-between align-items-center" style="background-color: var(--g-bg);">
            <div>
              <div class="fw-medium text-google-title small">Estado del Artículo</div>
              <div class="small text-google-muted mt-1">Si lo inactivas, los cajeros no podrán verlo ni venderlo en el POS.</div>
            </div>
            <div class="form-check form-switch m-0">
              <!-- ID: edit-estado -->
              <input class="form-check-input" type="checkbox" role="switch" id="edit-estado" checked style="width: 2.5rem; height: 1.25rem;">
              <label class="form-check-label small ms-2 fw-medium mt-1" style="color: var(--g-success);" for="edit-estado">Activo</label>
            </div>
          </div>

          <!-- Datos Generales -->
          <div class="row g-3 mb-3">
            <div class="col-md-4">
              <label class="form-label small fw-medium text-google-title">Código SKU</label>
              <!-- ID: edit-sku -->
              <input type="text" id="edit-sku" class="form-control form-control-google bg-light text-google-muted" readonly>
            </div>
            <div class="col-md-8">
              <label class="form-label small fw-medium text-google-title">Nombre Comercial *</label>
              <!-- ID: edit-nombre -->
              <input type="text" id="edit-nombre" class="form-control form-control-google">
            </div>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label small fw-medium text-google-title">Presentación / Descripción</label>
              <!-- ID: edit-desc -->
              <input type="text" id="edit-desc" class="form-control form-control-google">
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-medium text-google-title">Categoría</label>
              <!-- ID: edit-categoria -->
              <select id="edit-categoria" class="form-select form-control-google">
                <!-- Se llena con JS -->
              </select>
            </div>
          </div>

          <!-- Bloque Económico y Control -->
          <h6 class="fw-medium text-google-muted mb-3" style="font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px;">Precios y Control de Inventario</h6>
          
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label small fw-medium text-google-title">Precio de Costo (S/)</label>
              <div class="input-group">
                <span class="input-group-text bg-transparent border-google text-google-muted" style="border-right: none; border-radius: var(--radius-md) 0 0 var(--radius-md);">S/</span>
                <!-- ID: edit-costo -->
                <input type="number" id="edit-costo" step="0.01" class="form-control form-control-google" style="border-left: none; border-radius: 0 var(--radius-md) var(--radius-md) 0;">
              </div>
            </div>
            
            <div class="col-md-4">
              <label class="form-label small fw-medium text-google-title">Precio de Venta (S/) *</label>
              <div class="input-group">
                <span class="input-group-text border-google" style="background-color: var(--g-success-soft); color: var(--g-success); border-right: none; border-radius: var(--radius-md) 0 0 var(--radius-md);">S/</span>
                <!-- ID: edit-venta -->
                <input type="number" id="edit-venta" step="0.01" class="form-control form-control-google" style="border-left: none; border-radius: 0 var(--radius-md) var(--radius-md) 0;">
              </div>
            </div>
            
            <div class="col-md-4">
              <label class="form-label small fw-medium text-google-title">Stock Mínimo (Alerta)</label>
              <!-- ID: edit-stock-min -->
              <input type="number" id="edit-stock-min" class="form-control form-control-google">
            </div>
          </div>

        </form>
      </div>
      
      <div class="modal-footer border-top-0 pt-0 px-4 pb-4 d-flex justify-content-end gap-2">
        <button type="button" class="btn text-google-muted fw-medium rounded-pill px-4" data-bs-dismiss="modal">Cancelar</button>
        <!-- ID: btn-guardar-edit -->
        <button type="button" id="btn-guardar-edit" class="btn btn-google-primary px-4 shadow-sm">Guardar Cambios</button>
      </div>

    </div>
  </div>
</div>
