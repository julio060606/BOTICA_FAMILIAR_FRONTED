<!-- ========================================== -->
  <!-- MODAL: NUEVO PRODUCTO / EDICIÓN            -->
  <!-- ========================================== -->
  <div class="modal fade" id="modalNuevoProducto" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content modal-content-google">
        
        <div class="modal-header border-bottom-0 pt-4 px-4 pb-0">
          <h5 class="modal-title fw-medium text-google-title fs-5">Ficha de Producto</h5>
          <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        
        <div class="modal-body p-4">
          <form>
            
            <!-- Tipo de Producto (Normal vs Combo) -->
            <div class="mb-4 bg-light p-3 rounded-3 border-google d-flex justify-content-between align-items-center">
              <div>
                <div class="fw-medium text-google-title small">Tipo de Artículo</div>
                <div class="small text-google-muted">Un combo agrupa varios SKUs existentes.</div>
              </div>
              <div class="form-check form-switch m-0">
                <input class="form-check-input" type="checkbox" role="switch" id="switchCombo" style="width: 2.5rem; height: 1.25rem;">
                <label class="form-check-label small ms-2 fw-medium mt-1" for="switchCombo">Es un Combo</label>
              </div>
            </div>

            <!-- Datos Generales -->
            <div class="row g-3 mb-3">
              <div class="col-md-4">
                <label class="form-label small fw-medium text-google-title">Código SKU</label>
                <input type="text" class="form-control form-control-google" placeholder="Dejar en blanco para auto">
              </div>
              <div class="col-md-8">
                <label class="form-label small fw-medium text-google-title">Nombre Comercial *</label>
                <input type="text" class="form-control form-control-google" placeholder="Ej. Amoxicilina 500mg">
              </div>
            </div>

            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <label class="form-label small fw-medium text-google-title">Presentación / Descripción</label>
                <input type="text" class="form-control form-control-google" placeholder="Ej. Caja x 100 und">
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-medium text-google-title">Categoría</label>
                <select class="form-select form-control-google">
                  <option selected disabled>Seleccionar...</option>
                  <option>Analgésicos</option>
                  <option>Gastrointestinal</option>
                </select>
              </div>
            </div>

            <!-- Bloque Económico y Control -->
            <h6 class="fw-medium text-google-muted mb-3" style="font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px;">Precios y Control de Inventario</h6>
            
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label small fw-medium text-google-title">Precio de Costo (S/)</label>
                <div class="input-group">
                  <span class="input-group-text bg-transparent border-google text-google-muted" style="border-right: none; border-radius: 0.5rem 0 0 0.5rem;">S/</span>
                  <input type="number" step="0.01" class="form-control form-control-google" style="border-left: none; border-radius: 0 0.5rem 0.5rem 0;" placeholder="0.00">
                </div>
              </div>
              <div class="col-md-4">
                <label class="form-label small fw-medium text-google-title">Precio de Venta (S/) *</label>
                <div class="input-group">
                  <span class="input-group-text border-google" style="background-color: #e6f4ea; color: #137333; border-right: none; border-radius: 0.5rem 0 0 0.5rem;">S/</span>
                  <input type="number" step="0.01" class="form-control form-control-google" style="border-left: none; border-radius: 0 0.5rem 0.5rem 0;" placeholder="0.00">
                </div>
              </div>
              <div class="col-md-4">
                <label class="form-label small fw-medium text-google-title">Stock Mínimo (Alerta)</label>
                <input type="number" class="form-control form-control-google" placeholder="Ej. 10">
                <div class="form-text" style="font-size: 0.7rem;">Disparará alerta en Dashboard</div>
              </div>
            </div>

          </form>
        </div>
        
        <div class="modal-footer border-top-0 pt-0 px-4 pb-4 d-flex justify-content-end gap-2">
          <button type="button" class="btn text-google-muted fw-medium rounded-pill px-4" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary fw-medium rounded-pill px-4 shadow-sm" style="background-color: #1a73e8; border-color: #1a73e8;">Guardar Producto</button>
        </div>

      </div>
    </div>
  </div>
