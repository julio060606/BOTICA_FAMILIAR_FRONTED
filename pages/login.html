<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Botica Online - Ingreso</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

  <main class="container-limit px-3" style="max-width: 420px;">
    <!-- Tarjeta de Login estilo Google Material 3 -->
    <div class="card card-google p-4 p-sm-5">
      
      <!-- Encabezado / Logo -->
      <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3" style="width: 60px; height: 60px;">
          <i class="bi bi-capsule-capspoon fs-2"></i>
        </div>
        <h1 class="page-title mb-1 fs-4 text-google-title">Botica Familiar</h1>
        <p class="text-google-muted small mb-0">Inicia sesión para continuar</p>
      </div>

      <!-- Formulario -->
      <form id="form-login">
        
        <!-- Input Usuario -->
        <div class="mb-3">
          <label for="username" class="form-label text-google-title small fw-medium">Usuario</label>
          <div class="input-group">
            <span class="input-group-text bg-transparent border-end-0 text-muted">
              <i class="bi bi-person"></i>
            </span>
            <input type="text" id="username" class="form-control border-start-0 ps-0 text-google-title" placeholder="ej. user123" required style="border-radius: 0 var(--radius-md) var(--radius-md) 0;">
          </div>
        </div>

        <!-- Input Contraseña -->
        <div class="mb-4">
          <label for="password" class="form-label text-google-title small fw-medium">Contraseña</label>
          <div class="input-group">
            <span class="input-group-text bg-transparent border-end-0 text-muted">
              <i class="bi bi-lock"></i>
            </span>
            <input type="password" id="password" class="form-control border-start-0 ps-0 text-google-title" placeholder="••••••••" required style="border-radius: 0 var(--radius-md) var(--radius-md) 0;">
          </div>
        </div>

        <!-- Mensaje de Error (Estilizado con Bootstrap y tus variables) -->
        <div id="mensaje-error" class="alert alert-danger p-2 small mb-3 text-center" style="display: none; border-radius: var(--radius-md);">
          <i class="bi bi-exclamation-circle-fill me-1"></i> <span id="error-texto"></span>
        </div>

        <!-- Botón de Ingreso -->
        <button type="submit" class="btn btn-google-primary w-100 py-2">
          Ingresar <i class="bi bi-arrow-right ms-1"></i>
        </button>
        
      </form>

    </div>
  </main>

  <!-- Scripts -->
  <script src="/assets/js/login.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
