<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POS - Botica Familiar</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/main.css">

  <style>
    .buscador-pos {
      border-radius: 50px;
      padding: 14px 20px;
      font-size: 1.1rem;
      border: 2px solid #dadce0;
    }
    .buscador-pos:focus {
      border-color: var(--g-primary);
      box-shadow: 0 0 0 3px rgba(26,115,232,0.2);
    }
    .ticket-table td, .ticket-table th {
      vertical-align: middle;
    }
    .btn-cobrar {
      font-size: 1.25rem;
      padding: 16px 0;
      font-weight: bold;
    }
  </style>
</head>
<body class="app">

  <div class="d-flex" style="height: 100vh; overflow: hidden;">
    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <div class="flex-grow-1 d-flex flex-column">
      <!-- Navbar -->
      <div id="navbar-container"></div>

      <main class="flex-grow-1 overflow-auto p-4">
        <div class="container-fluid">

          <!-- Buscador con Autocompletado -->
          <div class="mb-4">
            <input type="text" id="buscador-pos" class="form-control buscador-pos shadow-sm" 
                   placeholder="Escanea código de barras o busca producto..." 
                   list="lista-productos-pos" autofocus>
          </div>

          <div class="row g-4">

            <!-- Ticket Actual -->
            <div class="col-lg-7">
              <div class="card h-100">
                <div class="card-header d-flex justify-content-between align-items-center bg-white">
                  <h5 class="mb-0">Ticket Actual</h5>
                  <button class="btn btn-outline-danger btn-sm" onclick="vaciarCarrito()">Vaciar Ticket</button>
                </div>
                <div class="card-body p-0">
                  <table class="table table-hover ticket-table mb-0">
                    <thead class="table-light">
                      <tr>
                        <th>Producto</th>
                        <th class="text-end">Precio Unit.</th>
                        <th class="text-center">Cantidad</th>
                        <th class="text-end">Subtotal</th>
                        <th class="text-center">Acción</th>
                      </tr>
                    </thead>
                    <tbody id="carrito-body"></tbody>
                  </table>
                </div>
              </div>
            </div>

            <!-- Resumen del Ticket -->
            <div class="col-lg-5">
              <div class="card h-100">
                <div class="card-header bg-white">
                  <h5>Resumen del Ticket</h5>
                </div>
                <div class="card-body">
                  <div class="d-flex justify-content-between mb-2">
                    <span>Subtotal</span>
                    <span id="subtotal">S/ 0.00</span>
                  </div>
                  <div class="d-flex justify-content-between mb-2">
                    <span>IGV (18%)</span>
                    <span id="igv">S/ 0.00</span>
                  </div>
                  <hr>
                  <div class="d-flex justify-content-between fs-4 fw-bold text-primary">
                    <span>Total a Pagar</span>
                    <span id="total">S/ 0.00</span>
                  </div>

                  <div class="mt-4">
                    <label class="form-label fw-medium">Medio de Pago</label>
                    <div class="d-flex flex-column gap-2">
                      <label class="d-flex align-items-center gap-2">
                        <input type="radio" name="medio_pago" value="EFECTIVO" checked> 💵 Efectivo
                      </label>
                      <label class="d-flex align-items-center gap-2">
                        <input type="radio" name="medio_pago" value="TARJETA"> 💳 Tarjeta
                      </label>
                      <label class="d-flex align-items-center gap-2">
                        <input type="radio" name="medio_pago" value="YAPE"> 📱 Yape
                      </label>
                    </div>
                  </div>
                </div>
                <div class="card-footer bg-white">
                  <button onclick="cobrarTicket()" class="btn btn-success w-100 btn-cobrar">
                    COBRAR TICKET →
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Inyectores -->
  <script src="/assets/js/inyector.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/pos.js"></script>
</body>
</html>
