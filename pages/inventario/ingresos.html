<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingreso de Mercadería - Botica Familiar</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/main.css">
</head>

<body class="app">

  <div class="d-flex" style="height: 100vh; overflow: hidden;">
    <div id="sidebar-container"></div>

    <div class="flex-grow-1 d-flex flex-column" style="overflow: hidden;">
      <div id="navbar-container"></div>

      <!-- MAIN CONTENT -->
      <main class="flex-grow-1" style="overflow-y: auto;">

        <div class="container-limit px-4 py-4">

          <!-- HEADER DE SECCIÓN -->
          <div class="d-flex justify-content-between align-items-center mb-4 pb-2">
            <div>
              <h1 class="page-title m-0">Ingreso de Mercadería</h1>
              <p class="small text-google-muted mt-1 m-0">Registra compras a proveedores y actualiza el stock</p>
            </div>
          </div>

          <div class="row g-4">

            <!-- BLOQUE 1: Datos del Comprobante -->
            <div class="col-lg-4">
              <div class="card card-google p-4 h-100">
                <h6 class="text-google-title mb-4 fw-bold">1. Datos del Documento</h6>

                <form class="d-flex flex-column gap-3">
                  <div>
                    <label class="form-label small fw-medium text-google-title">Proveedor *</label>
                    <select id="ing-proveedor" class="form-select form-control-google">
                      <option selected disabled>Seleccionar laboratorio/droguería...</option>
                      <!---->
                    </select>
                  </div>

                  <div>
                    <label class="form-label small fw-medium text-google-title">Nro. de Factura / Guía *</label>
                    <input id="ing-nro-doc" type="text" class="form-control form-control-google text-uppercase"
                      placeholder="Ej. F001-004582">
                  </div>

                  <div>
                    <label class="form-label small fw-medium text-google-title">Fecha de Emisión *</label>
                    <!-- Seteado a la fecha de hoy por defecto -->
                    <input id="ing-fecha" type="date" class="form-control form-control-google" value="2026-05-04">
                  </div>

                  <div>
                    <label class="form-label small fw-medium text-google-title">Observaciones</label>
                    <textarea class="form-control form-control-google" rows="2" placeholder="Opcional..."></textarea>
                  </div>
                </form>
              </div>
            </div>

            <!-- BLOQUE 2: Lista de Productos -->
            <div class="col-lg-8">
              <div class="card card-google d-flex flex-column h-100">

                <div
                  class="card-header bg-transparent py-3 px-4 border-bottom d-flex justify-content-between align-items-center">
                  <h6 class="text-google-title m-0 fw-bold">2. Detalle de Productos</h6>
                  <button class="btn btn-sm btn-google-primary d-flex align-items-center gap-2" data-bs-toggle="modal"
                    data-bs-target="#modalAgregarIngreso">
                    <span>+</span> Agregar Producto
                  </button>
                </div>

                <div class="table-responsive flex-grow-1">
                  <table class="table table-hover align-middle m-0 table-google">
                    <thead>
                      <tr>
                        <th>Producto</th>
                        <th>Lote / Venc.</th>
                        <th class="text-center">Cant.</th>
                        <th class="text-end">Costo Unit.</th>
                        <th class="text-end">Subtotal</th>
                        <th class="text-center"></th>
                      </tr>
                    </thead>

                    <tbody id="ing-tabla-body" class="border-top-0">
                      <!-- Deja esto totalmente vacío, JavaScript hará la magia -->
                    </tbody>
                  </table>
                </div>

                <!-- Footer con Totales y Botón Guardar -->
                <div class="card-footer bg-transparent border-top p-4">
                  <div class="d-flex justify-content-between align-items-end">
                    <div>
                      <button class="btn text-google-muted fw-medium rounded-pill px-4">Cancelar</button>
                    </div>
                    <div class="text-end">
                      <div class="small text-google-muted mb-1">Total Comprobante</div>

                      <!-- ⚠️ AQUÍ LA OTRA CLAVE: El ID para el texto del total -->
                      <div id="ing-total-text" class="fs-3 fw-bold text-google-title lh-1"
                        style="color: var(--g-primary) !important;">S/ 0.00</div>

                      <button id="ing-btn-guardar" class="btn btn-google-primary px-5 mt-3 py-2 fs-6 shadow-sm">
                        Registrar Ingreso de Mercadería
                      </button>
                    </div>
                  </div>
                </div>

              </div>
            </div>

          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Contenedor del Modal -->
  <div id="modal-ingresar-producto-container"></div>

  <!-- Scripts -->
  <script src="/assets/js/ingresos.js"></script>
  <script src="/assets/js/inyector.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
