<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centro de Alertas - Botica Familiar</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Sistema de Diseño Maestro -->
  <link rel="stylesheet" href="/assets/css/variables.css">

  <style>
    /* Estilo de Pestañas Google (Material 3) */
    .nav-tabs-google {
      border-bottom: 1px solid var(--g-border);
    }
    .nav-tabs-google .nav-link {
      border: none;
      border-bottom: 3px solid transparent;
      color: var(--g-text-muted);
      font-weight: 500;
      padding: 1rem 1.5rem;
      border-radius: 0;
      transition: all 0.2s ease;
    }
    .nav-tabs-google .nav-link:hover {
      background-color: rgba(26, 115, 232, 0.04);
      color: var(--g-primary);
    }
    .nav-tabs-google .nav-link.active {
      color: var(--g-primary);
      border-bottom-color: var(--g-primary);
      background-color: transparent;
    }
  </style>
  
</head>
<body class="app">

  <div class="d-flex" style="height: 100vh; overflow: hidden;">
    <!-- SIDEBAR -->
    <div id="sidebar-container"></div>

    <div class="flex-grow-1 d-flex flex-column" style="overflow: hidden;">
      <!-- NAVBAR -->
      <div id="navbar-container"></div>

      <!-- MAIN CONTENT -->
      <main class="flex-grow-1" style="overflow-y: auto;">
        
        <div class="container-limit px-4 py-4">

          <!-- HEADER DE SECCIÓN -->
          <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
              <h1 class="page-title m-0">Centro de Acción y Alertas</h1>
              <p class="small text-google-muted mt-1 m-0">Gestión de stock crítico y lotes próximos a vencer</p>
            </div>
            <div class="d-flex gap-3">
               <!-- Buscador específico para alertas -->
               <div class="search-google d-none d-md-flex align-items-center gap-2" style="width: 300px;">
                 <svg width="18" height="18" fill="var(--g-text-muted)" viewBox="0 0 16 16"><path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/></svg>
                 <!-- ID: alertas-buscador -->
                 <input type="text" id="alertas-buscador" placeholder="Buscar producto o SKU...">
               </div>
            </div>
          </div>

          <!-- CONTENEDOR PRINCIPAL DE ALERTAS -->
          <div class="card card-google overflow-hidden">
            
            <!-- Pestañas de Filtrado -->
            <ul class="nav nav-tabs-google bg-white" id="alertasTabs" role="tablist">
              <li class="nav-item" role="presentation">
                <button class="nav-link active d-flex align-items-center gap-2" data-bs-toggle="tab" data-bs-target="#tab-critico">
                  Stock y Reposición 
                  <!-- ID: badge-stock -->
                  <span id="badge-stock" class="badge badge-tonal-danger rounded-pill">0</span>
                </button>
              </li>
              <li class="nav-item" role="presentation">
                <button class="nav-link d-flex align-items-center gap-2" data-bs-toggle="tab" data-bs-target="#tab-vencer">
                  Vencimientos (90 días) 
                  <!-- ID: badge-vencer -->
                  <span id="badge-vencer" class="badge badge-tonal-warning rounded-pill">0</span>
                </button>
              </li>
              <li class="nav-item" role="presentation">
                <button class="nav-link d-flex align-items-center gap-2" data-bs-toggle="tab" data-bs-target="#tab-info">
                  Información 
                  <span class="badge badge-tonal-primary rounded-pill">0</span>
                </button>
              </li>
            </ul>

            <!-- Contenido de las Pestañas -->
            <div class="tab-content bg-white">
              
              <!-- PESTAÑA: STOCK (Rojas) -->
              <div class="tab-pane fade show active" id="tab-critico" role="tabpanel">
                <!-- ID: lista-stock -->
                <div class="list-group list-group-flush" id="lista-stock">
                  <div class="p-5 text-center text-google-muted">Cargando alertas de stock...</div>
                </div>
              </div>

              <!-- PESTAÑA: POR VENCER (Amarillas) -->
              <div class="tab-pane fade" id="tab-vencer" role="tabpanel">
                <!-- ID: lista-vencer -->
                <div class="list-group list-group-flush" id="lista-vencer">
                  <div class="p-5 text-center text-google-muted">Cargando alertas de vencimiento...</div>
                </div>
              </div>

              <!-- PESTAÑA: INFORMACIÓN -->
              <div class="tab-pane fade" id="tab-info" role="tabpanel">
                <div class="list-group list-group-flush" id="lista-info">
                   <div class="p-5 text-center text-google-muted">No hay notificaciones informativas recientes.</div>
                </div>
              </div>

            </div>
          </div>
          
        </div>
      </main>
    </div>
  </div>

  <script src="/assets/js/notifiaciones.js"></script>
  <script src="/assets/js/inyector.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
