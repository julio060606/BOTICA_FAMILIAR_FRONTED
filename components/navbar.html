<!-- ========================================== -->
<!-- NAVBAR (Cabecera Superior - Google Flat)   -->
<!-- ========================================== -->
<header class="sticky-top w-100"
  style="background-color: var(--g-surface); border-bottom: 1px solid var(--g-border); z-index: 10;">

  <!-- Contenedor maestro centralizado -->
  <div class="container-limit d-flex justify-content-between align-items-center py-3 px-4">

    <!-- LADO IZQUIERDO: Botón Móvil + Marca -->
    <div class="d-flex align-items-center gap-3">

      <!-- Botón Hamburguesa -->
      <button class="btn d-lg-none rounded-0 border-0 p-2 d-flex align-items-center justify-content-center shadow-none"
        type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMobile"
        style="background-color: var(--g-bg); color: var(--g-text-main); width: 40px; height: 40px;">
        <span style="font-size: 1.2rem; line-height: 1;">☰</span>
      </button>

      <!-- Identidad de Marca -->
      <div class="d-flex flex-column justify-content-center">
        <!-- Nivel 1: Principal -->
        <div class="fw-medium text-google-title" style="font-size: 1.1rem; line-height: 1.2;">
          Botica Familiar
        </div>
        <!-- Nivel 2: Secundario -->
        <div class="small text-google-muted">
          Sistema integrado de ventas
        </div>
      </div>

    </div>

    <!-- LADO DERECHO: Notificaciones y Rol -->
    <div class="d-flex align-items-center gap-3 gap-md-4">

      <!-- Icono de Notificaciones -->
      <button class="btn border-0 p-2 position-relative shadow-none"
        style="background-color: transparent; color: var(--g-text-muted);">

        <a href="/pages/notificaciones.html">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" class="bi bi-bell" viewBox="0 0 16 16">
          <path d="M8 16a2 2 0 0 0 2-2H6a2 2 0 0 0 2 2M8 1.918l-.797.161A4 4 0 0 0 4 6c0 .628-.134 2.197-.459 3.742-.16.767-.376 1.566-.663 2.258h10.244c-.287-.692-.502-1.49-.663-2.258C12.134 8.197 12 6.628 12 6a4 4 0 0 0-3.203-3.92zM14.22 12c.223.447.481.801.78 1H1c.299-.199.557-.553.78-1C2.68 10.2 3 6.88 3 6c0-2.42 1.72-4.44 4.005-4.901a1 1 0 1 1 1.99 0A5 5 0 0 1 13 6c0 .88.32 4.2 1.22 6"/>
        </svg>
        </a>



        <!-- Punto de alerta rojo (Mantenemos tu diseño cuadrado estricto) -->
        <span class="position-absolute top-0 start-100 translate-middle border border-white rounded-0"
          style="background-color: var(--g-danger); width: 10px; height: 10px; margin-top: 6px; margin-left: -6px;">
        </span>
      </button>

      <!-- Línea Separadora Vertical -->
      <div class="d-none d-sm-block" style="width: 1px; height: 28px; background-color: var(--g-border);"></div>

      <!-- Información del Rol -->
      <div class="d-flex align-items-center">
        <div class="text-end d-none d-md-block">
          <!-- Nivel 1: Principal -->
          <div class="fw-medium text-google-title" style="font-size: 0.95rem; letter-spacing: 0.5px; line-height: 1.2;">
            Administrador
          </div>
          <!-- Nivel 2: Secundario -->
          <div class="small fw-bold" style="color: var(--g-success); font-size: 0.75rem;">
            ● Turno Abierto
          </div>
        </div>
      </div>

    </div>
  </div>
</header>
